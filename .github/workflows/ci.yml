name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The install / auto-update link serves the committed file, so it must match the sources.
      - name: Script publié à jour
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/undiscord-remake.user.js n'est pas à jour : lance 'npm run build' et commite le résultat."
            git diff --stat -- dist/
            exit 1
          fi
