name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Le tag correspond à la version du package
        run: |
          expected="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$expected" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $expected de package.json."
            exit 1
          fi
      - name: Notes de version
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/undiscord-remake.user.js \
            --title "Undiscord Remake $GITHUB_REF_NAME" \
            --notes-file release-notes.md
